<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kinSin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238a1c3b'/%3E%3Cpath d='M16 14v36M16 36l13-12' fill='none' stroke='%23fff8f8' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M21 40C23 35.2 24.8 33 26.8 33S30.6 35.2 32.6 40 36.4 47 38.4 47 42.2 44.8 44.2 40 48 33 50 33' fill='none' stroke='%23f3d6de' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // Apply a saved light/dark choice before the first paint (no flash). No choice = follow the system.
  try {
    const t = localStorage.getItem('kinsin-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch { /* storage blocked: just follow the system */ }
</script>
<style>
  :root {
    --bg: #f9ecec;
    --paper: #fff8f8;
    --ink: #2a1a1e;
    --muted: #93767c;
    --line: #f0d9da;
    --accent: #8a1c3b;       /* wine */
    --accent-soft: #f3d6de;
    --user: #2a1a1e;
    --code-bg: #2a1a1e;
    --code-ink: #f6e9eb;
    --logo-k: #fff8f8;
    --logo-wave: #f3d6de;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Inter, sans-serif;
    color-scheme: light;
  }
  /* Dark: when the system is dark and the user hasn't picked light... */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1215; --paper: #26191d; --ink: #f3e6e8; --muted: #a88c92;
      --line: #36242a; --accent: #c94a6e; --accent-soft: #3d2029; --user: #f3e6e8;
      --code-bg: #140c0f; --code-ink: #f3e6e8;
      --logo-k: #fff3f5; --logo-wave: #2a1a1e;
      color-scheme: dark;
    }
  }
  /* ...or when the user picked dark */
  :root[data-theme="dark"] {
    --bg: #1c1215; --paper: #26191d; --ink: #f3e6e8; --muted: #a88c92;
    --line: #36242a; --accent: #c94a6e; --accent-soft: #3d2029; --user: #f3e6e8;
    --code-bg: #140c0f; --code-ink: #f3e6e8;
    --logo-k: #fff3f5; --logo-wave: #2a1a1e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans);
    display: flex;
    height: 100dvh;   /* phones: stays put when the address bar shows/hides (100% above is the fallback) */
  }
  /* The chat area (header, messages, input) to the right of the sidebar */
  .app { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .brand { font: 600 18px var(--mono); letter-spacing: -0.02em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 28px; height: 28px; flex-shrink: 0; }
  .brand-name { color: var(--ink); }
  .brand-name span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: #4e9a62; }
  .status { min-width: 0; }
  .dot { flex-shrink: 0; }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .theme-toggle, .menu-btn {
    flex-shrink: 0; width: 34px; height: 34px; padding: 0; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  }
  .theme-toggle:hover, .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg, .menu-btn svg { width: 17px; height: 17px; }
  .header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  /* Moon in light mode, sun in dark mode (follows the same rules as the colours) */
  .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-sun { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-sun { display: block; }
    :root:not([data-theme="light"]) .icon-moon { display: none; }
  }

  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 760px; margin: 0 auto; padding: 28px 20px 12px; }

  .empty { margin-top: 12vh; text-align: center; color: var(--muted); }
  .empty h1 { font: 600 clamp(26px, 5vw, 38px)/1.15 var(--mono); color: var(--ink); margin: 0 0 10px; letter-spacing: -0.03em; }
  .empty p { margin: 0 auto 22px; max-width: 440px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    padding: 7px 12px; border-radius: 999px; font: 14px var(--sans); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  .msg { margin: 0 0 22px; }
  .msg .who { font: 12px var(--mono); color: var(--muted); margin-bottom: 4px; }
  .msg.user .body {
    display: inline-block; background: var(--paper); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 14px; color: var(--user); max-width: 100%;
  }
  .msg .body { word-wrap: break-word; }
  .msg.user .body, .msg.error .body { white-space: pre-wrap; }
  .msg .meta { font: 12px var(--mono); color: var(--muted); margin-top: 6px; }
  .msg.error .body { color: #b3261e; }
  .meta .copy-reply { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
  /* stats + copy / listen / regenerate: wraps neatly on narrow screens */
  .msg .meta { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 2px; }
  .meta .stats:empty { display: none; }

  /* Formatted (Markdown) assistant replies */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.8em; }
  .md h3, .md h4 { line-height: 1.3; font-weight: 650; margin: 1.2em 0 0.5em; }
  .md h3 { font-size: 1.15rem; }
  .md h4 { font-size: 1.02rem; }
  .md strong { font-weight: 650; }
  .md a { color: var(--accent); text-underline-offset: 2px; }
  .md ul, .md ol { margin: 0 0 0.8em; padding-left: 1.5em; }
  .md li { margin: 0.2em 0; }
  .md li::marker { color: var(--accent); }
  .md li > p { margin: 0 0 0.4em; }
  .md li > :last-child { margin-bottom: 0; }
  .md li > ul, .md li > ol { margin-top: 0.2em; }
  .md blockquote { margin: 0 0 0.8em; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--accent); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .md :not(pre) > code { font: 0.88em var(--mono); background: var(--accent-soft); padding: 0.1em 0.35em; border-radius: 5px; }
  .codeblock { margin: 0 0 0.9em; background: var(--code-bg); color: var(--code-ink); border-radius: 12px; overflow: hidden; }
  .code-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 10px 6px 14px; font: 12px var(--mono); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .code-head span { opacity: 0.7; }
  .copy-code {
    background: none; color: inherit; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
    padding: 2px 9px; font: 12px var(--mono); cursor: pointer;
  }
  .copy-code:hover { border-color: rgba(255, 255, 255, 0.45); }
  .codeblock pre { margin: 0; padding: 12px 14px 14px; overflow-x: auto; font: 13.5px/1.55 var(--mono); tab-size: 4; }
  .codeblock code { font: inherit; white-space: pre; }
  .table-wrap { overflow-x: auto; margin: 0 0 0.9em; }
  .md table { border-collapse: collapse; font-size: 0.94em; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--accent-soft); font-weight: 600; }
  .cursor {
    display: inline-block; width: 8px; height: 1.1em; vertical-align: -0.15em;
    background: var(--accent); margin-left: 2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  footer { border-top: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
  form { max-width: 760px; margin: 0 auto; padding: 14px 20px 10px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 180px; min-height: 48px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font: 16px/1.5 var(--sans); outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send {
    height: 48px; padding: 0 18px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: #fff; font: 600 14px var(--sans);
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  button.send.stop { background: var(--ink); color: var(--bg); }
  .hint { max-width: 760px; margin: 0 auto; padding: 0 20px 12px; display: flex; justify-content: space-between; gap: 12px; font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 520px) { .hint .hint-keys { display: none; } .hint { justify-content: flex-end; } }
  .hint button { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }

  /* Chat history sidebar */
  .sidebar {
    width: 264px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--paper); border-right: 1px solid var(--line);
  }
  .new-chat {
    margin: 14px 12px 6px; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    background: none; border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
    font: 600 14px var(--sans); cursor: pointer;
  }
  .new-chat:hover { border-color: var(--accent); color: var(--accent); }
  .new-chat svg { width: 16px; height: 16px; flex-shrink: 0; }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .group-label {
    padding: 16px 10px 6px; font: 600 10.5px var(--mono); letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .chat-item { display: flex; align-items: center; border-radius: 10px; margin-bottom: 1px; }
  .chat-item:hover { background: var(--bg); }
  .chat-item.active { background: var(--accent-soft); }
  .chat-open {
    flex: 1; min-width: 0; padding: 8px 4px 8px 10px; text-align: left; cursor: pointer;
    background: none; border: 0; color: var(--ink); font: 14px/1.4 var(--sans);
  }
  .chat-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-actions { display: flex; gap: 2px; padding-right: 4px; opacity: 0; }
  .chat-item:hover .chat-actions, .chat-item.active .chat-actions,
  .chat-item:focus-within .chat-actions, .chat-item.confirming .chat-actions { opacity: 1; }
  .chat-actions button {
    height: 28px; min-width: 28px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 7px; color: var(--muted); cursor: pointer;
  }
  .chat-actions button:hover { color: var(--accent); }
  .chat-actions svg { width: 15px; height: 15px; }
  .chat-actions .chat-delete.confirm { padding: 0 8px; background: var(--accent); color: #fff; font: 600 11.5px var(--sans); }
  .rename-input {
    flex: 1; min-width: 0; margin: 3px 4px 3px 6px; padding: 4px 6px; outline: none;
    background: var(--bg); color: var(--ink); border: 1px solid var(--accent); border-radius: 7px; font: 14px var(--sans);
  }
  .sidebar-note { padding: 10px 16px 14px; border-top: 1px solid var(--line); font: 11px/1.5 var(--mono); color: var(--muted); }
  .menu-btn, .backdrop { display: none; }

  @media (max-width: 820px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20; max-width: 85vw;
      transform: translateX(-100%); visibility: hidden;
      transition: transform 0.25s ease, visibility 0s linear 0.25s;
    }
    body.sidebar-open .sidebar { transform: none; visibility: visible; transition: transform 0.25s ease; }
    .backdrop { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.45); }
    body.sidebar-open .backdrop { display: block; }
    .menu-btn { display: flex; }
    .chat-actions { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none !important; } }

  /* Edit / regenerate / retry */
  .msg-actions { margin-top: 4px; line-height: 1.4; }
  .edit-msg, .regen-btn, .retry-btn, .listen-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: 12px var(--mono); color: var(--muted); text-decoration: underline;
  }
  .edit-msg:hover, .regen-btn:hover, .retry-btn:hover, .listen-btn:hover { color: var(--accent); }
  .msg.user .msg-actions { visibility: hidden; }
  .msg.user:hover .msg-actions, .msg.user:focus-within .msg-actions { visibility: visible; }
  @media (hover: none) { .msg.user .msg-actions { visibility: visible; } }
  .app.busy .edit-msg, .app.busy .regen-btn, .app.busy .retry-btn { display: none; }
  .msg.pending .body { color: var(--muted); }
  .msg.editing > .body, .msg.editing > .msg-actions { display: none; }

  /* Photos: button, preview chip, drag-and-drop, and photos in messages */
  .photo-btn {
    flex-shrink: 0; width: 48px; height: 48px; padding: 0; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  }
  .photo-btn[hidden] { display: none; }
  .photo-btn:hover { border-color: var(--accent); color: var(--accent); }
  .photo-btn svg { width: 20px; height: 20px; }
  .attach { max-width: 760px; margin: 0 auto; padding: 10px 20px 0; }
  .attach[hidden] { display: none; }
  .photo-chip {
    display: flex; align-items: center; gap: 10px; max-width: 100%; width: fit-content;
    padding: 6px 6px 6px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  }
  .photo-chip img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--line); }
  .photo-chip .info { min-width: 0; flex: 1; line-height: 1.35; }
  .photo-chip .name { font: 600 13px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo-chip .state { font: 12px var(--mono); color: var(--muted); }
  .photo-chip .state.err { color: #b3261e; }
  .photo-remove {
    flex-shrink: 0; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; cursor: pointer;
    background: none; color: var(--muted); font: 20px/1 var(--sans);
  }
  .photo-remove:hover { color: var(--accent); background: var(--bg); }
  .app.dragging { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .msg-photo {
    display: block; max-width: min(260px, 100%); max-height: 260px; margin-bottom: 6px;
    border-radius: 12px; border: 1px solid var(--line);
  }
  .ocr-details { margin-top: 6px; font: 12px var(--mono); color: var(--muted); }
  .ocr-details summary { cursor: pointer; }
  .ocr-details pre {
    margin: 6px 0 0; padding: 10px 12px; max-height: 240px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  }
  @media (max-width: 520px) { .attach { padding: 8px 14px 0; } }

  /* Voice: microphone button and the hint row (language picker + status) */
  .mic-btn.recording, .mic-btn.recording:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .mic-btn.recording { animation: mic-pulse 1.4s ease-out infinite; }
  }
  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
    100% { box-shadow: 0 0 0 10px transparent; }
  }
  .mic-btn.working { opacity: 0.6; cursor: progress; }
  .hint { align-items: center; white-space: nowrap; }
  .hint .hint-keys { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .hint.has-status .hint-keys { display: none; }
  .hint > button { flex-shrink: 0; }
  .voice-row { display: flex; align-items: center; gap: 6px; min-width: 0; margin-right: auto; }
  .voice-row[hidden] { display: none; }
  .voice-row select {
    font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 2px; max-width: 92px;
  }
  .voice-status { color: var(--accent); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 520px) { form { gap: 8px; } }
  .edit-box { display: flex; flex-direction: column; gap: 8px; }
  textarea.edit-input { flex: none; width: 100%; min-height: 80px; max-height: 320px; resize: vertical; }
  .edit-buttons { display: flex; justify-content: flex-end; gap: 8px; }
  .edit-buttons button {
    height: 34px; padding: 0 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 600 13px var(--sans);
  }
  .edit-buttons button:hover { border-color: var(--accent); }
  .edit-buttons .edit-save { background: var(--accent); border-color: var(--accent); color: #fff; }
  .app.busy .edit-save { opacity: 0.5; cursor: default; }

  /* Phones */
  @media (max-width: 520px) {
    header { padding: 10px 14px; }
    #status { display: none; }          /* keep just the green dot */
    .thread { padding: 18px 14px 8px; }
    form { padding: 10px 14px 8px; }
    .codeblock pre { font-size: 12.5px; }
  }
</style>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <button class="new-chat" id="new-chat" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <nav class="chat-list" id="chat-list"></nav>
    <div class="sidebar-note">Chats are saved in this browser only.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="app">
  <header>
    <div class="header-left">
      <button class="menu-btn" id="menu" type="button" aria-label="Open chat list" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="var(--accent)"/>
          <path d="M16 14v36M16 36l13-12" fill="none" stroke="var(--logo-k)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 40C23 35.2 24.8 33 26.8 33S30.6 35.2 32.6 40 36.4 47 38.4 47 42.2 44.8 44.2 40 48 33 50 33" fill="none" stroke="var(--logo-wave)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">kin<span>Sin</span></span>
      </div>
    </div>
    <div class="header-right">
      <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
      <button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main id="scroller">
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <h1>An LLM, running on a CPU.</h1>
        <p>Written in Rust. No GPU, no cloud API: every word below is computed by this server, token by token.</p>
        <div class="chips">
          <button class="chip">What is Rust? Answer in two sentences.</button>
          <button class="chip">Explain recursion with a simple example.</button>
          <button class="chip">Write a haiku about a slow compiler.</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="attach" id="attach" hidden></div>
    <form id="form">
      <button class="photo-btn" id="photo-btn" type="button" aria-label="Add a photo" title="Add a photo (or paste / drop one)" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      </button>
      <input type="file" id="photo-input" accept="image/*" hidden>
      <button class="photo-btn mic-btn" id="mic-btn" type="button" aria-label="Speak instead of typing" aria-pressed="false" title="Speak" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask anything…" autofocus></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
    <div class="hint">
      <span class="hint-keys">Enter to send · Shift+Enter for a new line</span>
      <div class="voice-row" id="voice-row" hidden>
        <label for="voice-lang">voice</label>
        <select id="voice-lang" aria-label="Language you speak">
          <option value="auto">auto</option>
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>
        <span class="voice-status" id="voice-status" aria-live="polite"></span>
      </div>
      <button id="reset" type="button">New chat</button>
    </div>
  </footer>
  </div>

<script>
const thread = document.getElementById('thread');
const scroller = document.getElementById('scroller');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const form = document.getElementById('form');
const empty = document.getElementById('empty');

// --- Light/dark toggle ---
// The icon is switched by CSS; here we flip data-theme, remember it, and keep the label right.
const themeBtn = document.getElementById('theme');
const systemDark = matchMedia('(prefers-color-scheme: dark)');
function shownTheme() {
  return document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light');
}
function updateThemeLabel() {
  themeBtn.setAttribute('aria-label', shownTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
}
themeBtn.addEventListener('click', () => {
  const next = shownTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('kinsin-theme', next); } catch { /* storage blocked: works for this visit only */ }
  updateThemeLabel();
});
systemDark.addEventListener('change', updateThemeLabel);   // only matters while no choice is saved
updateThemeLabel();

let controller = null;     // lets the Stop button cancel the request

// --- Saved chats ---
// chats: [{ id, title, updated, messages: [{ role, content, meta? }] }], newest first when listed.
// current: the open chat. A new chat only joins `chats` once its first message is sent.
const STORE_KEY = 'kinsin-chats';
let chats = loadChats();
let current = blankChat();

function blankChat() {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), title: 'New chat', updated: Date.now(), messages: [] };
}
function loadChats() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    if (!Array.isArray(data)) return [];
    return data
      .filter(c => c && typeof c.id === 'string' && Array.isArray(c.messages))
      .map(c => ({
        id: c.id,
        title: String(c.title || 'Untitled').slice(0, 80),
        updated: Number(c.updated) || 0,
        messages: c.messages
          .filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
          .map(m => m.role === 'assistant'
            ? { role: m.role, content: m.content, meta: typeof m.meta === 'string' ? m.meta : '' }
            : userMessageFrom(m)),
      }))
      .filter(c => c.messages.length);
  } catch { return []; }   // blocked or corrupt storage: start with no history
}
function saveChats() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); } catch { /* blocked or full: keep going in memory */ }
}
function autoTitle(text) {
  const first = text.split('\n')[0].trim();
  return first.length > 42 ? first.slice(0, 40) + '…' : first;
}

// --- Server status: ask /v1/models which model is loaded ---
fetch('/v1/models')
  .then(r => r.json())
  .then(d => {
    const name = d.data[0].id.split(/[\\/]/).pop().replace('.gguf', '');
    document.getElementById('status').textContent = name;
    document.getElementById('dot').classList.add('on');
    ocrOn = d.kinsin?.ocr === true;
    photoBtn.hidden = !ocrOn;
    voiceOn = d.kinsin?.voice === true;
    micBtn.hidden = !voiceOn;
    voiceRow.hidden = !voiceOn;
  })
  .catch(() => { document.getElementById('status').textContent = 'server offline'; });

// --- Helpers ---
const appEl = document.querySelector('.app');
const isTouch = matchMedia('(hover: none)');   // phones/tablets: no hover, on-screen keyboard

function addMessage(role, text) {
  empty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="who">${role === 'user' ? 'you' : 'kinSin'}</div><div class="body"></div>`;
  const body = el.querySelector('.body');
  body.textContent = text;
  if (role === 'assistant') body.classList.add('md');
  if (role === 'user') el.insertAdjacentHTML('beforeend', '<div class="msg-actions"><button type="button" class="edit-msg">edit</button></div>');
  thread.appendChild(el);
  scrollDown();
  return el;
}
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
function setBusy(busy) {
  sendBtn.textContent = busy ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', busy);
  appEl.classList.toggle('busy', busy);   // hides edit / regenerate / retry while a reply streams
  if (!busy) refreshRegenerate();
}
// Focus the input, except on touch screens (it would pop up the keyboard)
function focusInput() { if (!isTouch.matches) input.focus(); }

// Draw every message of the open chat. data-index = position in chat.messages.
function renderThread() {
  const chat = current;
  stopSpeaking();
  thread.querySelectorAll('.msg').forEach(m => m.remove());
  empty.style.display = chat.messages.length ? 'none' : '';
  chat.messages.forEach((m, i) => {
    if (m.role === 'user') { addUserMessage(m, i); return; }
    const el = addMessage('assistant', '');
    el.dataset.index = i;
    el.querySelector('.body').innerHTML = renderMarkdown(m.content);
    if (m.meta) meta(el, m.meta);
    addReplyCopy(el, m.content);
  });
  // The last question never got an answer (e.g. the server failed earlier): offer a retry
  if (chat.messages.at(-1)?.role === 'user' && !controller) {
    const el = addMessage('assistant', 'No reply yet.');
    el.classList.add('pending');
    addRetry(el);
  }
  refreshRegenerate();
  scrollDown();
}

// "regenerate" goes on the last assistant message only (and never while a reply streams)
function refreshRegenerate() {
  thread.querySelectorAll('.regen-btn').forEach(b => b.remove());
  if (controller) return;
  const last = current.messages.length - 1;
  if (current.messages[last]?.role !== 'assistant') return;
  const el = thread.querySelector(`.msg.assistant[data-index="${last}"]`);
  if (el) metaLine(el).insertAdjacentHTML('beforeend', '<button type="button" class="regen-btn">regenerate</button>');
}
function addRetry(el) {
  metaLine(el).insertAdjacentHTML('beforeend', '<button type="button" class="retry-btn">retry</button>');
}

// --- Send a message, then stream the reply ---
async function send(text, photo = null) {
  const chat = current;
  const question = text || (photo ? 'What does this photo say?' : '');
  const msg = photo ? photoMessage(question, photo.thumb, photo.text) : { role: 'user', content: question };
  if (!chat.messages.length) chat.title = autoTitle(photo ? '📷 ' + question : question);
  chat.messages.push(msg);
  chat.updated = Date.now();
  if (!chats.includes(chat)) chats.push(chat);
  saveChats();
  renderChatList();
  addUserMessage(msg, chat.messages.length - 1);
  return generate(chat, { fromSend: true });
}

// Ask the server to answer chat.messages and stream the reply into a new assistant message.
// The result is saved to `chat`, even if the user has switched to another chat meanwhile.
async function generate(chat, { fromSend = false } = {}) {
  if (controller) return;                       // never two replies at once
  if (chat === current) thread.querySelectorAll('.msg.pending, .msg.error').forEach(m => m.remove());
  const messages = chat.messages.map(({ role, content }) => ({ role, content }));   // never send meta

  const bot = addMessage('assistant', '');
  bot.dataset.index = chat.messages.length;
  const body = bot.querySelector('.body');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  body.after(cursor);

  const myController = controller = new AbortController();
  setBusy(true);
  let reply = '';
  let metaText = '';
  let aborted = false;
  let failure = '';
  const started = performance.now();

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, stream: true }),
      signal: myController.signal,
    });
    if (!res.ok) throw new Error((await res.json()).error?.message || res.statusText);

    // Read the Server-Sent Events stream chunk by chunk
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Events are separated by a blank line; keep any unfinished one in the buffer
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const event of events) {
        const data = event.replace(/^data: ?/, '');
        if (data === '[DONE]') continue;
        const chunk = JSON.parse(data);
        if (chunk.error) throw new Error(chunk.error.message);
        const piece = chunk.choices?.[0]?.delta?.content;
        if (piece) {
          reply += piece;
          body.innerHTML = renderMarkdown(reply);
          if (bot.isConnected) scrollDown();
        }
        if (chunk.usage) {
          const u = chunk.usage;
          metaText = `${u.completion_tokens} tokens · ${u.tokens_per_sec} tok/s · ${((performance.now() - started) / 1000).toFixed(1)}s`;
          meta(bot, metaText);
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      aborted = true;
      metaText = 'stopped';
      meta(bot, metaText);
    } else if (reply) {
      metaText = 'Error: ' + err.message;
      meta(bot, metaText);   // keep the text that already arrived
    } else {
      failure = err.message || 'request failed';
    }
  } finally {
    cursor.remove();
    // Hand back the Send button first (unless a newer reply already took it)
    const mine = controller === myController;
    if (mine) controller = null;
    const shown = chat === current;

    if (reply) {
      // Finished, stopped or failed part-way: keep what arrived, so it can be regenerated
      addReplyCopy(bot, reply);
      chat.messages.push({ role: 'assistant', content: reply, meta: metaText });
      chat.updated = Date.now();
      if (shown && !bot.isConnected) renderThread();   // switched away and back mid-reply
    } else if (aborted) {
      // Stopped before any text: drop the empty bubble, and the question too if it was just sent
      bot.remove();
      if (fromSend && chat.messages.at(-1)?.role === 'user') chat.messages.pop();
      if (!chat.messages.length) chats = chats.filter(c => c !== chat);
      if (shown) renderThread();
    } else {
      // Failed with no text: show the error with a retry button. The error itself is not saved.
      if (bot.isConnected) {
        bot.classList.add('error');
        body.textContent = 'Error: ' + failure;
        addRetry(bot);
      } else if (shown) {
        renderThread();
      }
    }
    saveChats();
    renderChatList();
    if (mine) {
      setBusy(false);
      focusInput();
    } else if (shown) {
      refreshRegenerate();
    }
  }
}

// Stop a reply that is still streaming (before switching or starting a chat)
function stopReply() {
  if (!controller) return;
  controller.abort();
  controller = null;
  setBusy(false);
}

// --- Edit, regenerate, retry (one listener for the whole thread) ---
function regenerate() {
  const chat = current;
  if (controller || chat.messages.at(-1)?.role !== 'assistant') return;
  chat.messages.pop();                          // drop the last answer, ask again with the same conversation
  saveChats();
  renderThread();
  generate(chat);
}

function startEdit(msgEl) {
  if (controller || msgEl.classList.contains('editing')) return;
  const chat = current;
  const i = Number(msgEl.dataset.index);
  const editedMsg = chat.messages[i];
  const original = editedMsg?.display ?? editedMsg?.content;
  if (typeof original !== 'string') return;

  msgEl.classList.add('editing');               // CSS hides the bubble and the edit link
  const box = document.createElement('div');
  box.className = 'edit-box';
  box.innerHTML =
    '<textarea class="edit-input" rows="3" aria-label="Edit message"></textarea>' +
    '<div class="edit-buttons">' +
    '<button type="button" class="edit-cancel">Cancel</button>' +
    '<button type="button" class="edit-save">Save &amp; send</button>' +
    '</div>';
  const ta = box.querySelector('textarea');
  ta.value = original;
  msgEl.appendChild(box);
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 320) + 'px'; };
  fit();
  ta.addEventListener('input', fit);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const close = () => { box.remove(); msgEl.classList.remove('editing'); };
  const save = () => {
    if (controller) return;
    const text = ta.value.trim();
    if (!text) return;                          // empty: do nothing
    if (text === original) { close(); return; } // unchanged: just close
    chat.messages[i] = editedMsg.ocrText !== undefined
      ? photoMessage(text, editedMsg.image, editedMsg.ocrText)   // photo + its text stay, content is rebuilt
      : { role: 'user', content: text };
    chat.messages.length = i + 1;               // like ChatGPT: everything after the edited message goes
    chat.updated = Date.now();
    saveChats();
    renderChatList();
    renderThread();
    generate(chat);
  };
  box.querySelector('.edit-cancel').addEventListener('click', close);
  box.querySelector('.edit-save').addEventListener('click', save);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'Enter' && !e.shiftKey && !isTouch.matches) { e.preventDefault(); save(); }
  });
}

thread.addEventListener('click', e => {
  const btn = e.target.closest('.edit-msg, .regen-btn, .retry-btn');
  if (!btn || controller) return;
  const msgEl = btn.closest('.msg');
  if (btn.classList.contains('edit-msg')) startEdit(msgEl);
  else if (btn.classList.contains('regen-btn')) regenerate();
  else { msgEl.remove(); generate(current); }   // retry: drop the error bubble, ask again
});

// --- Sidebar: open, new, rename, delete ---
const chatList = document.getElementById('chat-list');
const ICON = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const PENCIL = ICON('M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z');
const TRASH = ICON('M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6');

function groupOf(ts) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const week = new Date(today); week.setDate(today.getDate() - 7);
  if (ts >= today.getTime()) return 'Today';
  if (ts >= yesterday.getTime()) return 'Yesterday';
  if (ts >= week.getTime()) return 'Previous 7 days';
  return 'Older';
}

function renderChatList() {
  if (chatList.querySelector('.rename-input')) return;   // don't throw away a rename in progress
  chatList.textContent = '';
  let group = '';
  for (const c of [...chats].sort((a, b) => b.updated - a.updated)) {
    const g = groupOf(c.updated);
    if (g !== group) {
      group = g;
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = g;
      chatList.appendChild(label);
    }
    const item = document.createElement('div');
    item.className = 'chat-item' + (c === current ? ' active' : '');
    item.dataset.id = c.id;
    item.innerHTML =
      '<button type="button" class="chat-open"><span class="chat-title"></span></button>' +
      '<div class="chat-actions">' +
      `<button type="button" class="chat-rename" aria-label="Rename chat" title="Rename">${PENCIL}</button>` +
      `<button type="button" class="chat-delete" aria-label="Delete chat" title="Delete">${TRASH}</button>` +
      '</div>';
    item.querySelector('.chat-title').textContent = c.title;   // titles are always plain text
    chatList.appendChild(item);
  }
}

function newChat() {
  stopReply();
  current = blankChat();
  renderThread();
  renderChatList();
  focusInput();
}
function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  if (chat !== current) {
    stopReply();
    current = chat;
    renderThread();
    renderChatList();
  }
  closeSidebar();
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (current.id === id) newChat();   // deleted the open chat: show a fresh one
  else renderChatList();
}
function startRename(item, chat) {
  const inp = document.createElement('input');
  inp.className = 'rename-input';
  inp.maxLength = 80;
  inp.value = chat.title;
  inp.setAttribute('aria-label', 'Chat name');
  item.querySelector('.chat-open').replaceWith(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    const title = inp.value.trim().slice(0, 80);
    if (save && title) { chat.title = title; saveChats(); }   // empty titles are ignored
    inp.remove();
    renderChatList();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}

// One listener for the whole list
chatList.addEventListener('click', e => {
  const item = e.target.closest('.chat-item');
  if (!item) return;
  const chat = chats.find(c => c.id === item.dataset.id);
  if (!chat) return;

  const del = e.target.closest('.chat-delete');
  if (del) {
    if (del.classList.contains('confirm')) { clearTimeout(del.resetTimer); deleteChat(chat.id); return; }
    // First click: ask. Goes back to the icon after 3 seconds.
    del.classList.add('confirm');
    del.textContent = 'Delete?';
    del.setAttribute('aria-label', 'Click again to delete');
    item.classList.add('confirming');
    del.resetTimer = setTimeout(() => {
      del.classList.remove('confirm');
      del.innerHTML = TRASH;
      del.setAttribute('aria-label', 'Delete chat');
      item.classList.remove('confirming');
    }, 3000);
    return;
  }
  if (e.target.closest('.chat-rename')) { startRename(item, chat); return; }
  if (e.target.closest('.chat-open')) openChat(chat.id);
});

// --- Mobile: slide-in sidebar ---
const menuBtn = document.getElementById('menu');
function openSidebar() {
  document.body.classList.add('sidebar-open');
  menuBtn.setAttribute('aria-expanded', 'true');
}
function closeSidebar() {
  document.body.classList.remove('sidebar-open');
  menuBtn.setAttribute('aria-expanded', 'false');
}
menuBtn.addEventListener('click', openSidebar);
document.getElementById('backdrop').addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) closeSidebar();
});
document.getElementById('new-chat').addEventListener('click', () => { newChat(); closeSidebar(); });

// The line under a reply: stats text, plus a "copy" link once the reply is finished
function metaLine(el) {
  let m = el.querySelector('.meta');
  if (!m) {
    m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = '<span class="stats"></span>';
    el.appendChild(m);
  }
  return m;
}
function meta(el, text) { metaLine(el).querySelector('.stats').textContent = text; }
function addReplyCopy(el, raw) {
  el.rawReply = raw;
  const m = metaLine(el);
  if (!m.querySelector('.copy-reply')) m.insertAdjacentHTML('beforeend', '<button type="button" class="copy-reply">copy</button>');
  if (canSpeak && !m.querySelector('.listen-btn')) m.insertAdjacentHTML('beforeend', '<button type="button" class="listen-btn">listen</button>');
}

// --- Copy buttons (one delegated listener for every message) ---
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through to the old way */ }
  // Fallback for plain-http pages (e.g. opened from another device on the LAN)
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}
thread.addEventListener('click', async e => {
  const btn = e.target.closest('.copy-code, .copy-reply');
  if (!btn) return;
  const text = btn.classList.contains('copy-code')
    ? btn.closest('.codeblock').querySelector('code').textContent
    : btn.closest('.msg').rawReply || '';
  const ok = await copyText(text);
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  btn.textContent = ok ? 'Copied' : 'Copy failed';
  clearTimeout(btn.resetTimer);
  btn.resetTimer = setTimeout(() => { btn.textContent = label; }, 1500);
});

// --- Markdown renderer ---
// No libraries. All model text is HTML-escaped before any tag is added, so the only
// tags that can appear are the ones built here.
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function indentOf(line) {
  let col = 0;
  for (const ch of line) {
    if (ch === ' ') col++;
    else if (ch === '\t') col += 4;
    else break;
  }
  return col;
}
function dedent(line, n) {
  let i = 0, col = 0;
  while (i < line.length && col < n && (line[i] === ' ' || line[i] === '\t')) { col += line[i] === '\t' ? 4 : 1; i++; }
  return line.slice(i);
}

const FENCE = /^([ \t]*)(`{3,}|~{3,})[ \t]*([^\s`]*)[^`]*$/;
const HEADING = /^[ \t]{0,3}(#{1,6})[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/;
const HR = /^[ \t]{0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const QUOTE = /^[ \t]*>/;
const LIST = /^([ \t]*)([-*+]|\d{1,9}[.)])(?:[ \t]+(.*))?$/;
const TABLE_DIVIDER = /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/;

function renderMarkdown(text) {
  return renderBlocks(text.replace(/\r\n?/g, '\n').replace(/\u0000/g, '').split('\n'));
}

function isTableStart(lines, i) {
  return lines[i].includes('|') && i + 1 < lines.length &&
    lines[i + 1].includes('|') && TABLE_DIVIDER.test(lines[i + 1]);
}
function isBlockStart(lines, i) {
  const l = lines[i];
  return FENCE.test(l) || HEADING.test(l) || HR.test(l) || QUOTE.test(l) || LIST.test(l) || isTableStart(lines, i);
}

function renderBlocks(lines) {
  let html = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) { i++; continue; }

    if ((m = line.match(FENCE))) {
      // Fenced code block; an unclosed fence (still streaming) runs to the end
      const indent = indentOf(m[1]), fence = m[2];
      const code = [];
      i++;
      while (i < lines.length) {
        const t = lines[i].trim();
        if (t.length >= fence.length && t === fence[0].repeat(t.length)) { i++; break; }
        code.push(dedent(lines[i], indent));
        i++;
      }
      html += codeBlock(m[3], code.join('\n'));
    } else if ((m = line.match(HEADING))) {
      const tag = m[1].length === 1 ? 'h3' : 'h4';
      html += `<${tag}>${inline(m[2])}</${tag}>`;
      i++;
    } else if (HR.test(line)) {
      html += '<hr>';
      i++;
    } else if (QUOTE.test(line)) {
      const inner = [];
      while (i < lines.length && QUOTE.test(lines[i])) inner.push(lines[i++].replace(/^[ \t]*> ?/, ''));
      html += `<blockquote>${renderBlocks(inner)}</blockquote>`;
    } else if (isTableStart(lines, i)) {
      const [part, next] = renderTable(lines, i);
      html += part;
      i = next;
    } else if (LIST.test(line)) {
      const [part, next] = renderList(lines, i);
      html += part;
      i = next;
    } else {
      // Paragraph: runs until a blank line or the start of another block
      const para = [line.trim()];
      i++;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) para.push(lines[i++].trim());
      html += `<p>${inline(para.join('\n'))}</p>`;
    }
  }
  return html;
}

function codeBlock(lang, code) {
  return '<div class="codeblock"><div class="code-head">' +
    `<span>${esc(lang || 'code')}</span><button type="button" class="copy-code">Copy</button>` +
    `</div><pre><code>${esc(code)}</code></pre></div>`;
}

function renderList(lines, i) {
  const first = lines[i].match(LIST);
  const base = indentOf(first[1]);
  const ordered = /\d/.test(first[2]);
  const start = ordered ? parseInt(first[2], 10) : 1;
  let html = ordered ? (start !== 1 ? `<ol start="${start}">` : '<ol>') : '<ul>';

  while (i < lines.length) {
    const m = lines[i].match(LIST);
    // Stop at anything that isn't another item of this same list
    if (!m || HR.test(lines[i]) || indentOf(m[1]) > base + 1 || /\d/.test(m[2]) !== ordered) break;

    // The item's own lines: its first line, then everything indented under it
    // (continuation text, nested lists, code blocks), dedented and rendered as blocks.
    const contentIndent = indentOf(m[1]) + m[2].length + 1;
    const body = [m[3] || ''];
    i++;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) {
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && indentOf(lines[j]) > base + 1) {
          while (i < j) { body.push(''); i++; }
          continue;
        }
        break;
      }
      if (indentOf(l) <= base + 1) break;
      body.push(dedent(l, contentIndent));
      i++;
    }
    html += `<li>${renderBlocks(body)}</li>`;
    while (i < lines.length && !lines[i].trim()) i++;   // blank lines between items
  }
  return [html + (ordered ? '</ol>' : '</ul>'), i];
}

// Split a table row on | (but not \| or a | inside `code`)
function splitRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  const cells = [];
  let cur = '', inCode = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '\\' && s[i + 1] === '|') { cur += '|'; i++; }
    else if (ch === '`') { inCode = !inCode; cur += ch; }
    else if (ch === '|' && !inCode) { cells.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}
function renderTable(lines, i) {
  const head = splitRow(lines[i]);
  const aligns = splitRow(lines[i + 1]).map(c =>
    /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : '');
  const cell = (tag, text, k) =>
    `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(text)}</${tag}>`;
  let html = '<div class="table-wrap"><table><thead><tr>' +
    head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>';
  i += 2;
  while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
    const row = splitRow(lines[i++]);
    html += '<tr>' + head.map((_, k) => cell('td', row[k] || '', k)).join('') + '</tr>';
  }
  return [html + '</tbody></table></div>', i];
}

// Inline formatting. Code spans and links are swapped out for \u0000n\u0000 placeholders
// so bold/italic rules can't touch their insides, then put back at the end.
function inline(text) {
  const held = [];
  const hold = html => '\u0000' + (held.push(html) - 1) + '\u0000';

  let s = text.replace(/(?<!`)(`+)(?!`)(.+?)(?<!`)\1(?!`)/g, (_, ticks, code) => {
    if (/^ .*[^ ].* $/.test(code)) code = code.slice(1, -1);
    return hold(`<code>${esc(code)}</code>`);
  });
  s = esc(s);
  // Links: http(s) only. The URL is already escaped, so it can't break out of the attribute.
  s = s.replace(/\[([^\]\n]+)\]\(\s*(https?:\/\/[^\s)\u0000]+)\s*\)/gi, (_, label, url) =>
    hold(`<a href="${url}" target="_blank" rel="noopener noreferrer">${emphasis(label)}</a>`));
  s = emphasis(s).replace(/\n/g, '<br>');

  const restore = str => str.replace(/\u0000(\d+)\u0000/g, (_, n) => restore(held[n]));
  return restore(s);
}
function emphasis(s) {
  return s
    .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
    .replace(/(^|[^\w*])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![\w*])/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
}

// --- Photos: read the text in them (OCR on the server) ---
const photoBtn = document.getElementById('photo-btn');
const photoInput = document.getElementById('photo-input');
const attachEl = document.getElementById('attach');
const NOT_A_PHOTO = 'this file is not a photo kinSin can open (try JPG or PNG)';
const MAX_OCR_CHARS = 8000;
let ocrOn = false;     // the server has the OCR models
let photo = null;      // the photo waiting to be sent: { name, thumb, text, error, reading, ready }

// The message saved for a question about a photo. Only role + content go to the model.
function photoMessage(question, image, ocrText) {
  const text = ocrText.length > MAX_OCR_CHARS ? ocrText.slice(0, MAX_OCR_CHARS) + '\n…(the rest was cut off)' : ocrText;
  return {
    role: 'user',
    content: 'I am sharing a photo. This is the text that was read from it:\n"""\n' + text + '\n"""\n\n' + question,
    display: question,
    image,
    ocrText,
  };
}
// A saved user message, keeping its photo fields (only a data: image is trusted as a picture)
function userMessageFrom(m) {
  const out = { role: 'user', content: m.content };
  if (typeof m.ocrText === 'string') {
    out.ocrText = m.ocrText;
    out.display = typeof m.display === 'string' ? m.display : m.content;
    if (typeof m.image === 'string' && m.image.startsWith('data:image/')) out.image = m.image;
  }
  return out;
}

// Draw a user message: the question, with the photo above it and the read text below it
function addUserMessage(m, index) {
  const el = addMessage('user', m.display ?? m.content);
  el.dataset.index = index;
  const body = el.querySelector('.body');
  if (m.image) {
    const img = document.createElement('img');
    img.className = 'msg-photo';
    img.alt = 'Photo you shared';
    img.src = m.image;
    body.before(img);
  }
  if (m.ocrText !== undefined) {
    const details = document.createElement('details');
    details.className = 'ocr-details';
    details.innerHTML = '<summary>Text read from the photo</summary><pre></pre>';
    details.querySelector('pre').textContent = m.ocrText;   // never innerHTML
    body.after(details);
  }
  return el;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(NOT_A_PHOTO)); };
    img.src = url;
  });
}
// The image scaled so its longest side is at most `max`, on a white background (for transparent PNGs)
function scaled(img, max) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w * k));
  canvas.height = Math.max(1, Math.round(h * k));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas;
}

// Add a photo: make a thumbnail, upload a copy, and read its text right away
function addPhoto(file) {
  if (!ocrOn || !file) return;
  const p = { name: file.name || 'Pasted photo', thumb: '', text: '', error: '', reading: true };
  photo = p;                                    // one photo at a time: replaces any earlier one
  drawChip();
  p.ready = (async () => {
    try {
      if (file.type && !file.type.startsWith('image/')) throw new Error(NOT_A_PHOTO);
      const img = await loadImage(file);
      p.thumb = scaled(img, 240).toDataURL('image/jpeg', 0.7);
      if (photo === p) drawChip();
      const blob = await new Promise(resolve => scaled(img, 2000).toBlob(resolve, 'image/jpeg', 0.9));
      if (!blob) throw new Error(NOT_A_PHOTO);
      const res = await fetch('/v1/ocr', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error?.message || res.statusText || 'could not read this photo');
      const text = typeof data.text === 'string' ? data.text.trim() : '';
      if (!text) throw new Error('No text found in this photo.');
      p.text = text;
    } catch (err) {
      p.error = err.message || 'could not read this photo';
    } finally {
      p.reading = false;
      if (photo === p) drawChip();
    }
  })();
}

// The preview chip above the input
function drawChip() {
  if (!photo) { attachEl.hidden = true; attachEl.textContent = ''; return; }
  attachEl.hidden = false;
  attachEl.innerHTML =
    '<div class="photo-chip"><img alt=""><div class="info"><div class="name"></div><div class="state"></div></div>' +
    '<button type="button" class="photo-remove" aria-label="Remove photo" title="Remove photo">×</button></div>';
  const img = attachEl.querySelector('img');
  if (photo.thumb) img.src = photo.thumb; else img.style.visibility = 'hidden';
  attachEl.querySelector('.name').textContent = photo.name;
  const state = attachEl.querySelector('.state');
  state.textContent = photo.reading ? 'reading the text…'
    : photo.error ? photo.error
    : `${photo.text.length} characters read · ask anything about it`;
  state.classList.toggle('err', !!photo.error);
}
attachEl.addEventListener('click', e => {
  if (e.target.closest('.photo-remove')) { photo = null; drawChip(); focusInput(); }
});

photoBtn.addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', () => {
  addPhoto(photoInput.files[0]);
  photoInput.value = '';                        // so the same file can be picked again
});
// Paste a photo (Ctrl+V anywhere)
document.addEventListener('paste', e => {
  if (!ocrOn) return;
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (file) { e.preventDefault(); addPhoto(file); }
});
// Drag and drop onto the chat area
let dragDepth = 0;
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
appEl.addEventListener('dragenter', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragDepth++;
  if (ocrOn) appEl.classList.add('dragging');
});
appEl.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
appEl.addEventListener('dragleave', e => {
  if (!isFileDrag(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) appEl.classList.remove('dragging');
});
appEl.addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();                           // never let the browser open the file instead of the chat
  dragDepth = 0;
  appEl.classList.remove('dragging');
  const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')) || e.dataTransfer.files[0];
  if (file) addPhoto(file);
});

// --- Voice input: record in the browser, Whisper on the server turns it into text ---
const micBtn = document.getElementById('mic-btn');
const voiceRow = document.getElementById('voice-row');
const voiceLang = document.getElementById('voice-lang');
const voiceStatus = document.getElementById('voice-status');
const hintRow = document.querySelector('.hint');
const MAX_RECORD_SECONDS = 60;
const MIN_RECORD_SECONDS = 0.6;
let voiceOn = false;       // the server has a Whisper model
let recording = null;      // { stream, ctx, source, node, chunks, rate, started, timer, autoStop }
let transcribing = false;
let statusTimer = null;

// Status text in the hint row. Errors and notes fade after a while; progress stays until replaced.
function setVoiceStatus(text, { sticky = false } = {}) {
  clearTimeout(statusTimer);
  voiceStatus.textContent = text;
  hintRow.classList.toggle('has-status', !!text);
  if (text && !sticky) statusTimer = setTimeout(() => setVoiceStatus(''), 6000);
}

try {
  const saved = localStorage.getItem('kinsin-voice-lang');
  if (['auto', 'en', 'hi'].includes(saved)) voiceLang.value = saved;
} catch { /* storage blocked: start with "auto" */ }
voiceLang.addEventListener('change', () => {
  try { localStorage.setItem('kinsin-voice-lang', voiceLang.value); } catch { /* not remembered, still used */ }
});

micBtn.addEventListener('click', () => {
  if (transcribing) return;
  if (recording) stopRecording(); else startRecording();
});

async function startRecording() {
  if (!navigator.mediaDevices?.getUserMedia) { setVoiceStatus('voice needs localhost or https'); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    const blocked = err.name === 'NotAllowedError' || err.name === 'SecurityError';
    setVoiceStatus(blocked ? 'microphone blocked: allow it in the browser'
      : err.name === 'NotFoundError' ? 'no microphone found' : 'could not start the microphone');
    return;
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
  const source = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  node.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(node);
  node.connect(ctx.destination);   // needed for the processor to run; it outputs silence

  recording = { stream, ctx, source, node, chunks, rate: ctx.sampleRate, started: performance.now() };
  micBtn.classList.add('recording');
  micBtn.setAttribute('aria-pressed', 'true');
  micBtn.setAttribute('aria-label', 'Stop recording');
  const tick = () => {
    const s = Math.floor((performance.now() - recording.started) / 1000);
    setVoiceStatus(`listening… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} · tap mic to stop`, { sticky: true });
  };
  tick();
  recording.timer = setInterval(tick, 250);
  recording.autoStop = setTimeout(stopRecording, MAX_RECORD_SECONDS * 1000);
}

async function stopRecording() {
  const r = recording;
  if (!r) return;
  recording = null;
  clearInterval(r.timer);
  clearTimeout(r.autoStop);
  r.node.onaudioprocess = null;
  r.source.disconnect();
  r.node.disconnect();
  r.stream.getTracks().forEach(t => t.stop());
  r.ctx.close().catch(() => {});
  micBtn.classList.remove('recording');
  micBtn.setAttribute('aria-pressed', 'false');
  micBtn.setAttribute('aria-label', 'Speak instead of typing');

  const length = r.chunks.reduce((n, c) => n + c.length, 0);
  if (length / r.rate < MIN_RECORD_SECONDS) { setVoiceStatus('too short: hold on a bit longer'); return; }
  const all = new Float32Array(length);
  let offset = 0;
  for (const c of r.chunks) { all.set(c, offset); offset += c.length; }
  const wav = encodeWav(downsample(all, r.rate, 16000), 16000);

  transcribing = true;
  micBtn.classList.add('working');
  setVoiceStatus('turning speech into text…', { sticky: true });
  try {
    const form = new FormData();
    form.append('file', new Blob([wav], { type: 'audio/wav' }), 'speech.wav');
    form.append('language', voiceLang.value);
    const res = await fetch('/v1/audio/transcriptions', { method: 'POST', body: form });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || res.statusText || 'speech to text failed');
    const text = typeof data.text === 'string' ? data.text.trim() : '';
    if (!text) { setVoiceStatus("didn't catch that, try again"); return; }
    const before = input.value.replace(/\s+$/, '');
    input.value = before ? before + ' ' + text : text;
    autosize();
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    setVoiceStatus('');
  } catch (err) {
    setVoiceStatus(err.message || 'speech to text failed');
  } finally {
    transcribing = false;
    micBtn.classList.remove('working');
  }
}

// 16 kHz for Whisper: average the samples that fall into each output step
function downsample(samples, from, to) {
  if (from === to) return samples;
  const ratio = from / to;
  const out = new Float32Array(Math.floor(samples.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(samples.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += samples[j];
    out[i] = end > start ? sum / (end - start) : samples[start];
  }
  return out;
}

// A 16-bit mono WAV file: 44-byte header + the samples
function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buffer);
  const text = (at, s) => { for (let i = 0; i < s.length; i++) v.setUint8(at + i, s.charCodeAt(i)); };
  text(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); text(8, 'WAVE');
  text(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  text(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buffer;
}

// --- Read answers aloud (the browser's own text-to-speech) ---
const canSpeak = 'speechSynthesis' in window;
let speakingBtn = null;
let speechRun = 0;          // which reading is current; older ones' events are ignored
if (canSpeak) speechSynthesis.getVoices();   // some browsers load the voice list lazily

function stopSpeaking() {
  if (!canSpeak || !speakingBtn) return;
  speechRun++;
  speechSynthesis.cancel();
  speakingBtn.textContent = 'listen';
  speakingBtn = null;
}

// What to read: the rendered answer, with code blocks replaced by "(code block)"
function spokenText(body) {
  const copy = body.cloneNode(true);
  copy.querySelectorAll('.codeblock').forEach(c => c.replaceWith(' (code block). '));
  copy.querySelectorAll('p, li, h3, h4, blockquote, tr, br').forEach(el => el.after('\n'));
  return copy.textContent.replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();
}

function pickVoice(lang) {
  const voices = speechSynthesis.getVoices();
  const norm = l => (l || '').replace('_', '-').toLowerCase();
  return voices.find(v => norm(v.lang) === lang.toLowerCase())
    || voices.find(v => norm(v.lang).startsWith(lang.slice(0, 2).toLowerCase())) || null;
}

function speak(btn) {
  const body = btn.closest('.msg')?.querySelector('.body');
  if (!body) return;
  if (speakingBtn === btn) { stopSpeaking(); return; }   // second click = stop
  stopSpeaking();                                       // only one at a time
  const text = spokenText(body);
  if (!text) return;
  const lang = /[\u0900-\u097F]/.test(text) ? 'hi-IN' : 'en-IN';
  const voice = pickVoice(lang);
  // Read in sentence-sized pieces: some browsers stop long utterances part-way
  const parts = (text.match(/[^.!?।\n]+[.!?।]*\s*|\n+/g) || [text])
    .reduce((acc, s) => {
      if (acc.length && (acc[acc.length - 1] + s).length < 220) acc[acc.length - 1] += s; else acc.push(s);
      return acc;
    }, [])
    .map(s => s.trim()).filter(Boolean);
  const run = ++speechRun;
  speakingBtn = btn;
  btn.textContent = 'stop';
  parts.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part);
    u.lang = lang;
    if (voice) u.voice = voice;
    const done = () => { if (run === speechRun && speakingBtn === btn) { btn.textContent = 'listen'; speakingBtn = null; } };
    if (i === parts.length - 1) u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
  });
}
thread.addEventListener('click', e => {
  const btn = e.target.closest('.listen-btn');
  if (btn && canSpeak) speak(btn);
});

// --- Input handling ---
let waitingForPhoto = false;
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }   // button is "Stop" while generating
  if (waitingForPhoto) return;
  const p = photo;
  if (!input.value.trim() && !p) return;
  if (p && p.reading) {
    // Still reading the photo: wait for it, then send
    waitingForPhoto = true;
    sendBtn.disabled = true;
    await p.ready;
    waitingForPhoto = false;
    sendBtn.disabled = false;
    if (photo !== p) return;                       // removed or replaced while waiting
  }
  if (p && p.error) return;                        // the chip says why
  const text = input.value.trim();
  if (!text && !p) return;
  input.value = '';
  autosize();
  photo = null;
  drawChip();
  send(text, p);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isTouch.matches) { e.preventDefault(); form.requestSubmit(); }
});
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
input.addEventListener('input', autosize);

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  if (!controller) send(c.textContent);
}));
document.getElementById('reset').addEventListener('click', () => { newChat(); closeSidebar(); });

// Start every visit with a fresh chat; saved ones are in the sidebar
renderChatList();
</script>
</body>
</html>
