# Runs on GitHub's computers on every push and pull request:
# builds kinSin, runs all tests, and checks that my engine stays free of ML libraries.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build files (makes later runs much faster)
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Run all tests (app + engine)
        run: cargo test --release --workspace

      - name: My engine must not depend on Candle or any ML library
        run: |
          if cargo tree -p kinsin-engine --edges normal | grep -iE "(^|[^a-z])(candle|tch|ort|burn)([^a-z]|$)"; then
            echo "kinsin-engine must be written from scratch: found an ML library above"
            exit 1
          fi
          echo "kinsin-engine depends only on: $(cargo tree -p kinsin-engine --depth 1 --edges normal | tail -n +2 | tr -d '├└─│ ' | tr '\n' ' ')"