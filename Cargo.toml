[package]
name = "rustllm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
hound = "3.5.1"
image = "0.25.10"
ocrs = "0.14.0"
rten = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors"] }

[profile.release]
opt-level = 3

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
