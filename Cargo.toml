[package]
name = "rustllm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
hound = "3.5.1"
image = "0.25.10"
ocrs = "0.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "system-proxy"] }
rten = "0.28.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors"] }
urlencoding = "2.1.3"
kinsin-engine = { path = "engine" }

# Optimisations matter a lot for inference speed.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
[workspace]
members = ["engine"]