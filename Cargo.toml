[package]
name = "rustllm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
candle-core = "0.11.1"
candle-transformers = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors"] }

[profile.release]
opt-level = 3
